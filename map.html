<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
async function renderMap() {
  const mapEl = document.getElementById('map');
  if (!mapEl || typeof L === 'undefined') {
    console.error('Leaflet not loaded or map element missing');
    return;
  }
  const map = L.map('map', {
    maxBounds: [[-90, -180], [90, 180]],
    minZoom: 2
  }).setView([25, 15], 2);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap',
    maxZoom: 18
  }).addTo(map);

  try {
    const res = await fetch('objects.json');
    const data = await res.json();
    const OBJECTS = data.objects || data;
    let count = 0;
    Object.entries(OBJECTS).forEach(([id, o]) => {
      // Пропускаем объекты без реальных координат (Global)
      if (!o.lat || !o.lon || (o.lat === 0 && o.lon === 0)) return;
      const color = o.status === 'red' ? '#FF4D4D' : o.status === 'green' ? '#4DFF88' : '#8A94C8';
      L.circleMarker([o.lat, o.lon], {radius: 8, color: color, fillOpacity: 0.8, weight: 2})
        .addTo(map)
        .bindPopup(`<b>${o.title}</b><br>${o.country}<br><a href="object.html?id=${id}">Details →</a>`);
      count++;
    });
    console.log(`Map rendered with ${count} markers`);
  } catch (e) {
    console.error('Failed to load objects.json', e);
  }
}
document.addEventListener('DOMContentLoaded', renderMap);
</script>
